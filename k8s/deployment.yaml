apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-equipment-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-equipment-booking
  template:
    metadata:
      labels:
        app: campus-equipment-booking
    spec:
      containers:
        - name: campus-equipment-booking
          image: campus-equipment-booking:set-a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10